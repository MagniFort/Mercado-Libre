<body style="text-align: center; font-family: Arial; margin-top: 100px;">
    <h2>Abriendo en Mercado Libre...</h2>
    <p>Si no abre automáticamente, toca el botón:</p>
    <a href="intent://articulo.mercadolibre.com.mx/MLM-2593161695-magnesio-12-en-1-suplemento-alimenticio-citrato-malato-sin-sabor-_JM#Intent;scheme=https;package=com.mercadolibre;end" 
       style="background: #3483fa; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">
       ABRIR EN LA APP
    </a>

    <script>
        (function() {
            var productUrl = "articulo.mercadolibre.com.mx/MLM-2593161695-magnesio-12-en-1-suplemento-alimenticio-citrato-malato-sin-sabor-_JM";
            
            // Intent para Android (Forza la App)
            var androidIntent = "intent://" + productUrl + "#Intent;scheme=https;package=com.mercadolibre;end";
            // Esquema para iOS
            var iosApp = "mercadolibre://products/MLM2593161695";
            // Web fallback
            var webUrl = "https://" + productUrl;

            var isAndroid = /Android/i.test(navigator.userAgent);
            
            // Intento de redirección inmediata
            if (isAndroid) {
                window.location.href = androidIntent;
            } else {
                window.location.href = iosApp;
            }

            // Fallback: si en 3 segundos no salió de aquí, manda a la web
            setTimeout(function() {
                window.location.href = webUrl;
            }, 3000);
        })();
    </script>
</body>
